<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Modélisateur de Miroir Concave</title>
    <script src="https://cdn.jsdelivr.net/npm/jsxgraph/distrib/jsxgraphcore.js"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/jsxgraph/distrib/jsxgraph.css">
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; background-color: #f4f4f9; }
        .container { max-width: 950px; margin: auto; background: white; padding: 20px; border-radius: 8px; box-shadow: 0 4px 8px rgba(0,0,0,0.1); }
        #jxgbox { border: 1px solid #ccc; border-radius: 4px; width: 100%; height: 500px; background: #fdfdfd; }
        
        .panel { margin-top: 15px; padding: 15px; border: 1px solid #e0e0e0; border-radius: 6px; background: #fcfcfc; }
        .panel-title { font-weight: bold; margin-bottom: 10px; color: #333; font-size: 1.1em; }
        
        .form-group { display: inline-block; margin-right: 15px; margin-bottom: 5px; }
        .form-group label { display: block; font-size: 0.85em; color: #666; margin-bottom: 3px;}
        .form-group input { padding: 6px; border: 1px solid #ccc; border-radius: 4px; width: 80px; text-align: center; font-size: 1em; }
        
        button { padding: 7px 14px; cursor: pointer; color: white; border: none; border-radius: 4px; font-size: 0.9em; transition: all 0.2s; margin-bottom: 5px; }
        button:hover { filter: brightness(0.9); transform: translateY(-1px); }
        .btn-set { background-color: #0056b3; }
        .btn-obj { background-color: #28a745; }
        .btn-tool { background-color: #6c757d; }
        .btn-tool.active { background-color: #d9534f !important; box-shadow: 0 0 8px rgba(217, 83, 79, 0.6); }
        .btn-perp { background-color: #8e44ad; }
        .btn-danger { background-color: #dc3545; }
        
        #instructions { margin-top: 15px; padding: 12px; color: #444; font-weight: bold; background: #e9ecef; border-radius: 4px; text-align: center; min-height: 20px; border-left: 4px solid #007bff; }

        #contextMenu {
            display: none;
            position: fixed; 
            background: white;
            border: 1px solid #ccc;
            border-radius: 6px;
            box-shadow: 0 6px 10px rgba(0,0,0,0.25);
            z-index: 1000;
            padding: 5px 0;
            width: 200px;
        }
        #contextMenu button {
            display: block;
            width: 100%;
            text-align: left;
            padding: 10px 15px;
            border: none;
            background: white;
            color: #333;
            border-radius: 0;
            margin: 0;
            font-size: 0.95em;
        }
        #contextMenu button:hover { background: #f0f0f0; }
        .menu-reel { color: #27ae60 !important; font-weight: bold; }
        .menu-virtuel { color: #2980b9 !important; font-weight: bold; }
        .menu-effacer { color: #c0392b !important; font-weight: bold; border-top: 1px solid #eee !important; margin-top: 4px !important; padding-top: 8px !important;}
        
        /* Nouveaux boutons ajoutés pour la suppression individuelle */
        .menu-effacer-rayon { color: #e67e22 !important; font-weight: bold; border-top: 1px solid #eee !important; margin-top: 4px !important; padding-top: 8px !important;}
        .menu-effacer-point { color: #8e44ad !important; font-weight: bold; }
    </style>
</head>
<body>

<div class="container">
    <h2 style="text-align: center; margin-top: 0; color: #333;">Construction Graphique - Miroir Concave</h2>
    
    <div id="jxgbox"></div>
    
    <div id="contextMenu">
        <button class="menu-reel" onclick="setSegmentStatus('reel')">Réel (Trait plein)</button>
        <button class="menu-virtuel" onclick="setSegmentStatus('virtuel')">Virtuel (Pointillé)</button>
        <button class="menu-effacer" onclick="setSegmentStatus('effacer')">Effacer cette partie</button>
        <!-- Boutons ajoutés (masqués par défaut via JS) -->
        <button class="menu-effacer-rayon" id="menuDelRay" style="display:none;" onclick="deleteLogicalRay()">Supprimer tout le rayon</button>
        <button class="menu-effacer-point" id="menuDelPoint" style="display:none;" onclick="deleteStandaloneElement()">Supprimer ce point/élément</button>
    </div>

    <div class="panel">
        <div class="panel-title">1. Paramètres du miroir</div>
        <div class="form-group">
            <label>Distance focale f' :</label>
            <input type="number" id="inputF" value="3" step="0.5" min="0.5">
        </div>
        <button id="btnSetF" class="btn-set">Appliquer f'</button>
    </div>

    <div class="panel">
        <div class="panel-title">2. Placer l'objet AB</div>
        <div class="form-group">
            <label>Distance SA (cm) :</label>
            <input type="number" id="inputDist" value="7" step="0.5" min="0.5">
        </div>
        <div class="form-group">
            <label>Taille AB (cm) :</label>
            <input type="number" id="inputTaille" value="1.5" step="0.5">
        </div>
        <button id="btnObjet" class="btn-obj">Placer l'objet</button>
    </div>

    <div class="panel">
        <div class="panel-title">3. Outils de tracé</div>
        <button id="btnRayon2Pts" class="btn-tool">Rayon (2 clics)</button>
        <button id="btnRayonParallele" class="btn-tool">Rayon Parallèle (3 clics)</button>
        <button id="btnReflexion" class="btn-tool">Réflexion (3 clics)</button>
        <button id="btnIntersection" class="btn-tool">Intersection (2 clics)</button>
        <button id="btnPerp" class="btn-perp">Tracer A' (Perpendiculaire)</button>
        <button id="btnClearRays" class="btn-danger" style="margin-left: 15px;">Tout effacer</button>
    </div>

    <div id="instructions">Outil Réflexion : 1. Cliquez le rayon incident. 2. Cliquez l'origine de la normale (ex: S). 3. Cliquez l'extrémité (ex: C).</div>
</div>

    <script>
        const board = JXG.JSXGraph.initBoard('jxgbox', {
            boundingbox: [-12, 6, 12, -6],
            axis: false,
            keepaspectratio: true,
            showNavigation: false
        });

        const contextMenu = document.getElementById('contextMenu');
        const instructions = document.getElementById('instructions');
        let toolMode = ''; 
        let activeSegment = null; 
        let activeElement = null; // Ajouté pour les points seuls
        
        let tempPoint = null;
        let dirPoint1 = null;
        let dirPoint2 = null;
        let interSeg1 = null; 
        let reflSeg1 = null; 
        
        let allDrawnElements = []; 
        let raySegments = [];      
        let logicalRays = [];      // Ajouté pour lier les segments d'un même rayon
        let standaloneElements = []; // Ajouté pour les points et traits seuls (A', normales)
        let objElements = [];
        let rayEquations = []; 
        let intersectionCounter = 0;
        let mirrorDrawElements = []; 

        let fValue = 3;
        const mirrorHeight = 5;
        const X_MIN = -12, X_MAX = 12, Y_MIN = -6, Y_MAX = 6;

        // --- ÉLÉMENTS DE BASE ---
        board.create('line', [[X_MIN, 0], [X_MAX, 0]], { strokeColor: 'black', strokeWidth: 1, fixed: true, highlight: false });
        board.create('arrow', [[11.5, 0], [X_MAX, 0]], {fixed: true, highlight: false});
        
        function drawMirror() {
            mirrorDrawElements.forEach(el => board.removeObject(el));
            mirrorDrawElements = [];
            let R = 2 * fValue; 
            let curve = board.create('curve', [
                function(y){ return -R + Math.sqrt(Math.max(0, R*R - y*y)); },
                function(y){ return y; }, -mirrorHeight, mirrorHeight
            ], { strokeColor: 'black', strokeWidth: 3, fixed: true, highlight: false });
            mirrorDrawElements.push(curve);
            for(let i = -4; i <= 4; i++) {
                let y = i * (mirrorHeight / 4);
                let xCurve = -R + Math.sqrt(Math.max(0, R*R - y*y));
                let hatch = board.create('segment', [[xCurve, y], [xCurve + 0.4, y - 0.4]], {strokeColor:'black', strokeWidth:1.5, fixed:true, highlight:false});
                mirrorDrawElements.push(hatch);
            }
        }
        drawMirror();

        let pointS = board.create('point', [0, 0], {name: 'S', size: 3, fixed: true, color: 'black', highlight: false});
        let pointFp = board.create('point', [-fValue, 0], {name: "F'", size: 3, fixed: true, color: 'green', highlight: false});
        let pointC = board.create('point', [-2*fValue, 0], {name: 'C', size: 3, fixed: true, color: 'darkgreen', highlight: false});

        // --- GESTION PARAMÈTRES & OBJET ---
        document.getElementById('btnSetF').addEventListener('click', function() {
            let val = parseFloat(document.getElementById('inputF').value);
            if (isNaN(val) || val <= 0) return;
            fValue = val;
            pointFp.moveTo([-fValue, 0], 500);
            pointC.moveTo([-2*fValue, 0], 500);
            drawMirror(); 
        });

        document.getElementById('btnObjet').addEventListener('click', function() {
            if (toolMode !== '') resetTool();
            let d = parseFloat(document.getElementById('inputDist').value);
            let h = parseFloat(document.getElementById('inputTaille').value);
            if (isNaN(d) || d <= 0 || isNaN(h) || h === 0) return;
            objElements.forEach(el => board.removeObject(el));
            objElements = [];
            let xObj = -d; 
            let pointA = board.create('point', [xObj, 0], { name: 'A', size: 4, color: 'red', fixed: true, highlight: false });
            let pointB = board.create('point', [xObj, h], { name: 'B', size: 4, color: 'red', fixed: true, highlight: false });
            let objArrow = board.create('arrow', [pointA, pointB], { strokeColor: 'red', strokeWidth: 2, fixed: true, highlight: false });
            objElements.push(pointA, pointB, objArrow);
        });

        // --- OUTILS ---
        function resetTool() {
            toolMode = '';
            tempPoint = null; dirPoint1 = null; dirPoint2 = null; interSeg1 = null; reflSeg1 = null;
            document.querySelectorAll('.btn-tool, .btn-perp').forEach(btn => btn.classList.remove('active'));
            board.defaultCursor = 'default';
            instructions.innerText = "Cliquez sur un tronçon de droite pour modifier son statut, ou sur un point pour le supprimer.";
        }

        function activateTool(mode, btnId, msg) {
            if (toolMode === mode) { resetTool(); return; }
            resetTool(); toolMode = mode; 
            document.getElementById(btnId).classList.add('active'); 
            board.defaultCursor = 'crosshair';
            instructions.innerText = msg;
        }

        document.getElementById('btnRayon2Pts').addEventListener('click', function() { activateTool('pt1', 'btnRayon2Pts', "RAYON (1/2) : Point de départ."); });
        document.getElementById('btnRayonParallele').addEventListener('click', function() { activateTool('par1', 'btnRayonParallele', "PARALLÈLE (1/3) : 1er point de direction."); });
        document.getElementById('btnIntersection').addEventListener('click', function() { activateTool('inter1', 'btnIntersection', "INTERSECTION (1/2) : Cliquez sur le 1er segment."); });
        document.getElementById('btnReflexion').addEventListener('click', function() { activateTool('refl1', 'btnReflexion', "RÉFLEXION (1/3) : Cliquez sur le rayon INCIDENT."); });
        document.getElementById('btnPerp').addEventListener('click', function() { activateTool('perp', 'btnPerp', "PERPENDICULAIRE : Cliquez sur B' pour tracer A'."); });

        // --- LOGIQUE MATHÉMATIQUE ---
        function snapToPoint(x, y) {
            let threshold = 0.6; let closestX = x; let closestY = y; let minDist = Infinity;
            for (let id in board.objects) {
                let obj = board.objects[id];
                if (obj.elType === 'point' && obj.visProp.visible !== false && obj.visProp.hidden !== true) {
                    let dx = obj.X() - x; let dy = obj.Y() - y; let dist = Math.sqrt(dx*dx + dy*dy);
                    if (dist < threshold && dist < minDist) { minDist = dist; closestX = obj.X(); closestY = obj.Y(); }
                }
            }
            return { x: closestX, y: closestY };
        }

        function getClickedSegment(x, y, threshold = 0.4, excludeSeg = null) {
            let closestSeg = null; let minDist = Infinity;
            for (let i = 0; i < raySegments.length; i++) {
                let seg = raySegments[i]; 
                if (seg === excludeSeg) continue; 
                if (!seg.point1 || !seg.point2) continue;
                
                let x1 = seg.point1.X(), y1 = seg.point1.Y();
                let x2 = seg.point2.X(), y2 = seg.point2.Y();
                let dx = x2 - x1, dy = y2 - y1;
                let lengthSq = dx*dx + dy*dy;
                if (lengthSq === 0) continue;
                
                let t = ((x - x1)*dx + (y - y1)*dy) / lengthSq;
                t = Math.max(0, Math.min(1, t)); 
                
                let projX = x1 + t * dx, projY = y1 + t * dy;
                let dist = Math.sqrt((x - projX)**2 + (y - projY)**2);
                
                if (dist < threshold && dist < minDist) { 
                    minDist = dist; 
                    closestSeg = seg; 
                }
            }
            return closestSeg;
        }

        // Ajout : détecter un point dessiné
        function getClickedPoint(x, y, threshold = 0.5) {
            let closest = null; let minDist = Infinity;
            for (let el of standaloneElements) {
                if (el.elType === 'point' && el.visProp.visible !== false) {
                    let d = Math.hypot(el.X() - x, el.Y() - y);
                    if (d < threshold && d < minDist) { minDist = d; closest = el; }
                }
            }
            return closest;
        }

        function addCustomRay(x1, y1, x2, y2) {
            let dx = x2 - x1; let dy = y2 - y1;
            let m = (Math.abs(dx) < 0.01) ? Infinity : dy / dx;
            
            let currentLogicalRay = { segments: [], points: [] };
            
            if (m === Infinity) {
                let pA = board.create('point', [x1, Y_MIN], {visible: false, fixed: true, highlight: false});
                let pB = board.create('point', [x1, Y_MAX], {visible: false, fixed: true, highlight: false});
                let seg = board.create('segment', [pA, pB], { strokeColor: '#555555', strokeWidth: 1.5, fixed: true, highlight: false, dash: 0 });
                raySegments.push(seg); allDrawnElements.push(pA, pB, seg);
                currentLogicalRay.segments.push(seg); currentLogicalRay.points.push(pA, pB);
                rayEquations.push({ m: Infinity, xMin: X_MIN, xMax: X_MAX, isVert: true });
            } else {
                let p = y1 - m * x1;
                let R = 2 * fValue;
                let A = 1 + m*m, B = 2*R + 2*m*p, C = p*p;
                let delta = B*B - 4*A*C;
                let boundsX = [X_MIN, x1, X_MAX];

                if (delta >= 0) {
                    let sqrtDelta = Math.sqrt(delta);
                    let xI = (-B + sqrtDelta) / (2 * A);
                    let yI = m * xI + p; 
                    if (xI <= 0.1 && xI >= -R && Math.abs(yI) <= mirrorHeight) {
                        boundsX.push(xI); 
                        let impactPoint = board.create('point', [xI, yI], {name: '', size: 4, color: 'black', fixed: true, highlight: false});
                        allDrawnElements.push(impactPoint);
                        currentLogicalRay.points.push(impactPoint);
                    }
                }

                boundsX.sort((a, b) => a - b);
                for (let i = 0; i < boundsX.length - 1; i++) {
                    let xa = boundsX[i], xb = boundsX[i+1]; if (xa === xb) continue;
                    let ya = m * xa + p, yb = m * xb + p;
                    let pA = board.create('point', [xa, ya], {visible: false, fixed: true, highlight: false});
                    let pB = board.create('point', [xb, yb], {visible: false, fixed: true, highlight: false});
                    let seg = board.create('segment', [pA, pB], { strokeColor: '#555555', strokeWidth: 1.5, fixed: true, highlight: false, dash: 0 });
                    raySegments.push(seg); allDrawnElements.push(pA, pB, seg);
                    currentLogicalRay.segments.push(seg); currentLogicalRay.points.push(pA, pB);
                }
                rayEquations.push({ m: m, p: p, xMin: X_MIN, xMax: X_MAX, isVert: false });
            }
            logicalRays.push(currentLogicalRay);
            if (rayEquations.length > 1) checkIntersections();
        }

        function checkIntersections() {
            let newEq = rayEquations[rayEquations.length - 1];
            let oldEq = rayEquations[rayEquations.length - 2];
            if (newEq.isVert && oldEq.isVert) return;
            if (!newEq.isVert && !oldEq.isVert && Math.abs(newEq.m - oldEq.m) < 0.001) return;
            let xi, yi, valid = false;
            if (newEq.isVert) { xi = newEq.xMin; yi = oldEq.m * xi + oldEq.p; valid = true; } 
            else if (oldEq.isVert) { xi = oldEq.xMin; yi = newEq.m * xi + newEq.p; valid = true; } 
            else { 
                xi = (oldEq.p - newEq.p) / (newEq.m - oldEq.m); // BUG CORRIGÉ ICI
                yi = newEq.m * xi + newEq.p; valid = true; 
            }
            if (valid) {
                let inNew = newEq.isVert ? true : (xi >= newEq.xMin - 0.5 && xi <= newEq.xMax + 0.5);
                let inOld = oldEq.isVert ? true : (xi >= oldEq.xMin - 0.5 && xi <= oldEq.xMax + 0.5);
                if (inNew && inOld && Math.abs(xi) > 0.1 && Math.abs(yi) < Y_MAX) {
                    intersectionCounter++;
                    let name = (intersectionCounter === 1) ? "B'" : "I" + (intersectionCounter - 1);
                    let pInt = board.create('point', [xi, yi], { name: name, size: 4, color: 'black', fixed: true, highlight: false });
                    allDrawnElements.push(pInt);
                    standaloneElements.push(pInt); // Ajouté pour pouvoir le supprimer
                }
            }
        }

        // --- LOGIQUE DU MENU ---
        function setSegmentStatus(status) {
            if (!activeSegment) return;
            if (status === 'reel') activeSegment.setAttribute({strokeColor: '#e67e22', dash: 0, strokeWidth: 1.5});
            else if (status === 'virtuel') activeSegment.setAttribute({strokeColor: '#2980b9', dash: 2, strokeWidth: 1.5});
            else if (status === 'effacer') {
                // Supprimer uniquement cette partie du segment
                board.removeObject(activeSegment); 
                let idx = raySegments.indexOf(activeSegment); 
                if (idx > -1) raySegments.splice(idx, 1);
                
                // Nettoyer le rayon logique associé
                for(let lr of logicalRays) {
                    let sIdx = lr.segments.indexOf(activeSegment);
                    if(sIdx > -1) {
                        lr.segments.splice(sIdx, 1);
                        if(lr.segments.length === 0) logicalRays = logicalRays.filter(l => l !== lr);
                        break;
                    }
                }
            }
            contextMenu.style.display = 'none'; activeSegment = null;
        }

        // NOUVELLE FONCTION : Supprimer tout le rayon logique
        function deleteLogicalRay() {
            if (!activeSegment) return;
            let parentRay = logicalRays.find(lr => lr.segments.includes(activeSegment));
            if (parentRay) {
                parentRay.points.forEach(p => board.removeObject(p));
                parentRay.segments.forEach(s => board.removeObject(s));
                raySegments = raySegments.filter(s => !parentRay.segments.includes(s));
                allDrawnElements = allDrawnElements.filter(el => !parentRay.points.includes(el) && !parentRay.segments.includes(el));
                logicalRays = logicalRays.filter(lr => lr !== parentRay);
            }
            contextMenu.style.display = 'none'; activeSegment = null;
        }

        // NOUVELLE FONCTION : Supprimer un point/élément seul
        function deleteStandaloneElement() {
            if (!activeElement) return;
            board.removeObject(activeElement);
            allDrawnElements = allDrawnElements.filter(el => el !== activeElement);
            standaloneElements = standaloneElements.filter(el => el !== activeElement);
            contextMenu.style.display = 'none'; activeElement = null;
        }

        document.addEventListener('mousedown', function(e) { if (!contextMenu.contains(e.target)) contextMenu.style.display = 'none'; }, true);

        // --- INTERCEPTION DES CLICS SOURIS ---
        document.getElementById('jxgbox').addEventListener('mousedown', function(e) {
            e.preventDefault(); e.stopPropagation();
            contextMenu.style.display = 'none';

            let cPos = board.getMousePosition(e);
            let coords = new JXG.Coords(JXG.COORDS_BY_SCREEN, cPos, board);
            let x = coords.usrCoords[1]; let y = coords.usrCoords[2];

            if (toolMode !== '') {
                let snapped = snapToPoint(x, y); x = snapped.x; y = snapped.y;

                if (toolMode === 'pt1') { tempPoint = {x: x, y: y}; toolMode = 'pt2'; instructions.innerText = "RAYON (2/2) : 2ème point.";}
                else if (toolMode === 'pt2') { addCustomRay(tempPoint.x, tempPoint.y, x, y); resetTool();}
                else if (toolMode === 'par1') { dirPoint1 = {x: x, y: y}; toolMode = 'par2'; instructions.innerText = "PARALLÈLE (2/3) : 2ème point.";}
                else if (toolMode === 'par2') { dirPoint2 = {x: x, y: y}; toolMode = 'par3'; instructions.innerText = "PARALLÈLE (3/3) : Point de passage.";}
                else if (toolMode === 'par3') { let dx = dirPoint2.x - dirPoint1.x; let dy = dirPoint2.y - dirPoint1.y; addCustomRay(x, y, x + dx, y + dy); resetTool();}
                
                // OUTIL INTERSECTION
                else if (toolMode === 'inter1') {
                    interSeg1 = getClickedSegment(x, y, 0.4, null);
                    if(interSeg1) { toolMode = 'inter2'; instructions.innerText = "INTERSECTION (2/2) : Cliquez sur le 2ème segment."; }
                }
                else if (toolMode === 'inter2') {
                    let seg2 = getClickedSegment(x, y, 0.4, interSeg1); 
                    if(seg2) {
                        let x1 = interSeg1.point1.X(), y1 = interSeg1.point1.Y(), x2 = interSeg1.point2.X(), y2 = interSeg1.point2.Y();
                        let x3 = seg2.point1.X(), y3 = seg2.point1.Y(), x4 = seg2.point2.X(), y4 = seg2.point2.Y();
                        let m1 = (x2-x1) === 0 ? Infinity : (y2-y1)/(x2-x1);
                        let m2 = (x4-x3) === 0 ? Infinity : (y4-y3)/(x4-x3);
                        if (m1 !== Infinity && m2 !== Infinity && Math.abs(m1 - m2) > 0.001) {
                            let p1 = y1 - m1*x1, p2 = y3 - m2*x3;
                            let xi = (p2 - p1)/(m1 - m2), yi = m1 * xi + p1;
                            let in1 = xi >= Math.min(x1,x2)-0.5 && xi <= Math.max(x1,x2)+0.5 && yi >= Math.min(y1,y2)-0.5 && yi <= Math.max(y1,y2)+0.5;
                            let in2 = xi >= Math.min(x3,x4)-0.5 && xi <= Math.max(x3,x4)+0.5 && yi >= Math.min(y3,y4)-0.5 && yi <= Math.max(y3,y4)+0.5;
                            if (in1 && in2) {
                                intersectionCounter++;
                                let pInt = board.create('point', [xi, yi], { name: "J" + intersectionCounter, size: 4, color: 'black', fixed: true, highlight: false });
                                allDrawnElements.push(pInt);
                                standaloneElements.push(pInt);
                            } else alert("Les droites se croisent hors des segments.");
                        } else alert("Segments parallèles.");
                        resetTool();
                    }
                }

                // OUTIL RÉFLEXION EN 3 ÉTAPES DYNAMIQUES
                else if (toolMode === 'refl1') {
                    reflSeg1 = getClickedSegment(x, y, 0.4, null);
                    if(reflSeg1) { 
                        toolMode = 'refl2'; 
                        instructions.innerText = "RÉFLEXION (2/3) : Cliquez sur l'origine de la NORMALE (ex: S)."; 
                    }
                }
                else if (toolMode === 'refl2') {
                    tempPoint = {x: x, y: y};
                    toolMode = 'refl3';
                    instructions.innerText = "RÉFLEXION (3/3) : Cliquez sur l'extrémité de la NORMALE (ex: C).";
                }
                else if (toolMode === 'refl3') {
                    // 1. Tracer visuellement la normale pour l'élève
                    let pN1 = board.create('point', [tempPoint.x, tempPoint.y], {visible: false, fixed: true, highlight: false});
                    let pN2 = board.create('point', [x, y], {visible: false, fixed: true, highlight: false});
                    let normalVisuelle = board.create('segment', [pN1, pN2], { 
                        strokeColor: '#aaaaaa', strokeWidth: 1.5, fixed: true, highlight: false, dash: 1 
                    });
                    allDrawnElements.push(pN1, pN2, normalVisuelle);
                    standaloneElements.push(pN1, pN2, normalVisuelle);

                    // 2. Calculs
                    let x1 = reflSeg1.point1.X(), y1 = reflSeg1.point1.Y(), x2 = reflSeg1.point2.X(), y2 = reflSeg1.point2.Y();
                    let m1 = (x2-x1) === 0 ? Infinity : (y2-y1)/(x2-x1);
                    let p1 = y1 - m1*x1;
                    let m2 = (x - tempPoint.x) === 0 ? Infinity : (y - tempPoint.y) / (x - tempPoint.x);
                    let p2 = tempPoint.y - m2*tempPoint.x;

                    let xi, yi;
                    if (m1 === Infinity) { xi = x1; yi = m2 * xi + p2; }
                    else if (m2 === Infinity) { xi = tempPoint.x; yi = m1 * xi + p1; }
                    else { xi = (p2 - p1) / (m1 - m2); yi = m1 * xi + p1; }

                    let d1 = Math.hypot(x1-xi, y1-yi); let d2 = Math.hypot(x2-xi, y2-yi);
                    let Px = d1 > d2 ? x1 : x2, Py = d1 > d2 ? y1 : y2;

                    let Hx, Hy;
                    if (m2 === Infinity) { Hx = tempPoint.x; Hy = Py; }
                    else {
                        let t = ((Px - tempPoint.x)*(x - tempPoint.x) + (Py - tempPoint.y)*(y - tempPoint.y)) / (Math.pow(x - tempPoint.x, 2) + Math.pow(y - tempPoint.y, 2));
                        Hx = tempPoint.x + t * (x - tempPoint.x); Hy = tempPoint.y + t * (y - tempPoint.y);
                    }

                    let SymX = 2 * Hx - Px, SymY = 2 * Hy - Py;

                    // 3. Tracer le rayon réfléchi
                    addCustomRay(xi, yi, SymX, SymY);
                    
                    tempPoint = null;
                    resetTool();
                }

                else if (toolMode === 'perp') {
                    let p1 = board.create('point', [x, Y_MIN], {visible: false, fixed: true, highlight: false});
                    let p2 = board.create('point', [x, Y_MAX], {visible: false, fixed: true, highlight: false});
                    let line = board.create('segment', [p1, p2], { strokeColor: 'gray', strokeWidth: 1.5, fixed: true, highlight: false, dash: 2 });
                    allDrawnElements.push(p1, p2, line);
                    standaloneElements.push(p1, p2, line);
                    let pointAp = board.create('point', [x, 0], { name: "A'", size: 4, color: 'black', fixed: true, highlight: false });
                    allDrawnElements.push(pointAp);
                    standaloneElements.push(pointAp);
                    resetTool();
                }
                return;
            }

            // --- MODE PAR DÉFAUT (Menu contextuel avec clic gauche) ---
            // 1. Cherche un segment
            let clickedSeg = getClickedSegment(x, y, 0.3, null);
            if (clickedSeg) {
                activeSegment = clickedSeg;
                // Affiche tous les boutons de segment
                document.getElementById('menuDelRay').style.display = 'block';
                document.getElementById('menuDelPoint').style.display = 'none';
                
                contextMenu.style.display = 'block';
                contextMenu.style.left = e.clientX + 'px';
                contextMenu.style.top = e.clientY + 'px';
                return;
            }

            // 2. Cherche un point seul (A', I1, B' etc...)
            let clickedPt = getClickedPoint(x, y, 0.5);
            if (clickedPt) {
                activeElement = clickedPt;
                activeSegment = null;
                // Cache les boutons de segment, montre le bouton de point
                document.querySelectorAll('.menu-reel, .menu-virtuel, .menu-effacer, .menu-effacer-rayon').forEach(b => b.style.display = 'none');
                document.getElementById('menuDelPoint').style.display = 'block';
                
                contextMenu.style.display = 'block';
                contextMenu.style.left = e.clientX + 'px';
                contextMenu.style.top = e.clientY + 'px';
                return;
            }
        }, true);

        document.getElementById('btnClearRays').addEventListener('click', function() {
            allDrawnElements.forEach(el => board.removeObject(el));
            allDrawnElements = []; raySegments = []; rayEquations = []; logicalRays = []; standaloneElements = []; intersectionCounter = 0; 
            resetTool();
        });

        resetTool();
    </script>
</body>
</html>
