<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 150" width="100%" height="100%">
  <style>
    .math-text {
      font-family: 'Times New Roman', Times, serif;
      font-size: 64px;
      fill: #222222;
    }
    .italic {
      font-style: italic;
    }
    .radical {
      stroke: #222222;
      stroke-width: 4;
      stroke-linecap: round;
      stroke-linejoin: round;
      fill: none;
    }
  </style>

  <rect width="100%" height="100%" fill="#faf8f5" rx="10"/>

  <g transform="translate(50, 95)">
    <text x="0" y="0" class="math-text italic">i</text>
    
    <text x="40" y="-3" class="math-text">=</text>
    
    <path d="M 115,-15 L 125,-15 L 137,12 L 160,-48 L 265,-48" class="radical" />
    
    <text x="175" y="0" class="math-text">−</text>
    <text x="215" y="0" class="math-text">1</text>
  </g>
</svg>
