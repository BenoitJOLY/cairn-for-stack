<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Modélisateur de Miroir convexe</title>
    <script src="https://cdn.jsdelivr.net/npm/jsxgraph/distrib/jsxgraphcore.js"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/jsxgraph/distrib/jsxgraph.css">
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; background-color: #f4f4f9; }
        .container { max-width: 950px; margin: auto; background: white; padding: 20px; border-radius: 8px; box-shadow: 0 4px 8px rgba(0,0,0,0.1); }
        #jxgbox { border: 1px solid #ccc; border-radius: 4px; width: 100%; height: 500px; background: #fdfdfd; }
        
        .panel { margin-top: 15px; padding: 15px; border: 1px solid #e0e0e0; border-radius: 6px; background: #fcfcfc; }
        .panel-title { font-weight: bold; margin-bottom: 10px; color: #333; font-size: 1.1em; }
        
        .form-group { display: inline-block; margin-right: 15px; margin-bottom: 5px; }
        .form-group label { display: block; font-size: 0.85em; color: #666; margin-bottom: 3px;}
        .form-group input { padding: 6px; border: 1px solid #ccc; border-radius: 4px; width: 80px; text-align: center; font-size: 1em; }
        
        button { padding: 7px 14px; cursor: pointer; color: white; border: none; border-radius: 4px; font-size: 0.9em; transition: all 0.2s; margin-bottom: 5px; }
        button:hover { filter: brightness(0.9); transform: translateY(-1px); }
        .btn-set { background-color: #0056b3; }
        .btn-obj { background-color: #28a745; }
        .btn-tool { background-color: #6c757d; }
        .btn-perp { background-color: #17a2b8; }
        .btn-danger { background-color: #dc3545; }
        button.active { background-color: #dc3545 !important; box-shadow: 0 0 8px rgba(220, 53, 69, 0.6); }
        
        #instructions { margin-top: 15px; padding: 12px; color: #444; font-weight: bold; background: #e9ecef; border-radius: 4px; text-align: center; min-height: 20px; border-left: 4px solid #007bff; }
    </style>
</head>
<body>

<div class="container">
    <h2 style="text-align: center; margin-top: 0; color: #333;">Construction Graphique - Miroir convexe</h2>
    
    <div id="jxgbox"></div>
    
    <div class="panel">
        <div class="panel-title">1. Paramètres du miroir</div>
        <div class="form-group">
            <label>Distance focale f' :</label>
            <input type="number" id="inputF" value="3" step="0.5" min="0.5">
        </div>
        <button id="btnSetF" class="btn-set">Appliquer f'</button>
    </div>

    <div class="panel">
        <div class="panel-title">2. Placer l'objet AB</div>
        <div class="form-group">
            <label>Distance SA (cm) :</label>
            <input type="number" id="inputDist" value="7" step="0.5" min="0.5">
        </div>
        <div class="form-group">
            <label>Taille AB (cm) :</label>
            <input type="number" id="inputTaille" value="2" step="0.5">
        </div>
        <button id="btnObjet" class="btn-obj">Placer l'objet</button>
    </div>

    <div class="panel">
        <div class="panel-title">3. Tracer les rayons</div>
        <button id="btnRayonParallele" class="btn-tool">Rayon parallèle (3 clics)</button>
        <button id="btnRayon2Pts" class="btn-tool">Rayon quelconque (2 clics)</button>
        <button id="btnPerp" class="btn-perp">Tracer A' (Perpendiculaire)</button>
        <button id="btnClearRays" class="btn-danger" style="margin-left: 15px;">Tout effacer</button>
    </div>

    <div id="instructions">Clic à gauche = Rayon incident. Clic sur la courbe = Rayon réfléchi.</div>
</div>

    <script>
        const board = JXG.JSXGraph.initBoard('jxgbox', {
            boundingbox: [-12, 6, 12, -6],
            axis: false,
            keepaspectratio: true,
            showNavigation: false
        });

        const instructions = document.getElementById('instructions');
        let mode = ''; 
        let tempPoint = null;
        let customRays = [];
        let objElements = [];
        let rayEquations = []; 
        let intersectionCounter = 0;
        let mirrorDrawElements = []; 

        let dirPoint1 = null;
        let dirPoint2 = null;

        let fValue = 3;
        const mirrorHeight = 5;
        const X_MIN = -12;
        const X_MAX = 12;
        const Y_MIN = -6;
        const Y_MAX = 6;

        // --- ÉLÉMENTS DE BASE ---
        board.create('line', [[X_MIN, 0], [X_MAX, 0]], { strokeColor: 'black', strokeWidth: 1, fixed: true, highlight: false });
        board.create('arrow', [[11.5, 0], [X_MAX, 0]], {fixed: true, highlight: false});
        
        // --- DESSIN RÉEL DU MIROIR (Arc de cercle + Hachures) ---
        function drawMirror() {
            mirrorDrawElements.forEach(el => board.removeObject(el));
            mirrorDrawElements = [];

            let R = 2 * fValue; // Rayon de courbure
            
            // 1. L'arc de cercle (la face réfléchissante)
            let curve = board.create('curve', [
                function(y){ return R - Math.sqrt(Math.max(0, R*R - y*y)); },
                function(y){ return y; },
                -mirrorHeight, mirrorHeight
            ], { strokeColor: 'black', strokeWidth: 3, fixed: true, highlight: false });
            mirrorDrawElements.push(curve);

            // 2. Les hachures obliques derrière la courbe
            for(let i = -4; i <= 4; i++) {
                let y = i * (mirrorHeight / 4);
                let xCurve = R - Math.sqrt(Math.max(0, R*R - y*y));
                let hatch = board.create('segment', [[xCurve, y], [xCurve + 0.4, y - 0.4]], {
                    strokeColor:'black', strokeWidth:1.5, fixed:true, highlight:false
                });
                mirrorDrawElements.push(hatch);
            }
        }
        drawMirror();

        // Points optiques
        let pointS = board.create('point', [0, 0], {name: 'S', size: 3, fixed: true, color: 'black', highlight: false});
        let pointF = board.create('point', [fValue, 0], {name: 'F', size: 3, fixed: true, color: 'green', highlight: false});
        let pointC = board.create('point', [2*fValue, 0], {name: 'C', size: 3, fixed: true, color: 'darkgreen', highlight: false});

        // --- GESTION MIROIR ---
        document.getElementById('btnSetF').addEventListener('click', function() {
            let val = parseFloat(document.getElementById('inputF').value);
            if (isNaN(val) || val <= 0) { alert("Distance focale invalide."); return; }
            fValue = val;
            pointF.moveTo([fValue, 0], 500);
            pointC.moveTo([2*fValue, 0], 500);
            drawMirror(); 
        });

        // --- GESTION OBJET ---
        document.getElementById('btnObjet').addEventListener('click', function() {
            if (mode !== '') resetMode();
            let d = parseFloat(document.getElementById('inputDist').value);
            let h = parseFloat(document.getElementById('inputTaille').value);
            if (isNaN(d) || d <= 0) { alert("La distance SA doit être positive."); return; }
            if (isNaN(h) || h === 0) { alert("La taille AB doit être non nulle."); return; }
            drawObject(d, h);
        });

        function drawObject(d, h) {
            objElements.forEach(el => board.removeObject(el));
            objElements = [];
            let xObj = -d; 
            let pointA = board.create('point', [xObj, 0], { name: 'A', size: 4, color: 'red', fixed: true, highlight: false });
            let pointB = board.create('point', [xObj, h], { name: 'B', size: 4, color: 'red', fixed: true, highlight: false });
            let objArrow = board.create('arrow', [pointA, pointB], { strokeColor: 'red', strokeWidth: 2, fixed: true, highlight: false });
            objElements.push(pointA, pointB, objArrow);
        }

        // --- FONCTION AIMANT (SNAP) ---
        function snapToPoint(x, y) {
            let threshold = 0.6; 
            let closestX = x;
            let closestY = y;
            let minDist = Infinity;
            
            for (let id in board.objects) {
                let obj = board.objects[id];
                if (obj.elType === 'point' && obj.visProp.visible !== false && obj.visProp.hidden !== true) {
                    let dx = obj.X() - x;
                    let dy = obj.Y() - y;
                    let dist = Math.sqrt(dx*dx + dy*dy);
                    
                    if (dist < threshold && dist < minDist) {
                        minDist = dist;
                        closestX = obj.X();
                        closestY = obj.Y();
                    }
                }
            }
            return { x: closestX, y: closestY };
        }

        // --- LOGIQUE DES RAYONS (INTERSECTION COURBE) ---
        function addCustomRay(x1, y1, x2, y2, color = 'orange') {
            let dx = x2 - x1;
            let dy = y2 - y1;
            let drawnSegments = [];
            let isVert = (Math.abs(dx) < 0.01);

            if (isVert) {
                let targetY = (dy > 0) ? Y_MAX : Y_MIN;
                drawnSegments.push({x1: x1, y1: y1, x2: x1, y2: targetY});
                rayEquations.push({ m: null, p: null, xMin: x1, xMax: x1, yMin: Math.min(y1, targetY), yMax: Math.max(y1, targetY), color, isVert: true });

            } else {
                let m = dy / dx;
                let p = y1 - m * x1;
                
                // 1. RAYON RÉFLÉCHI : Le clic de départ est sur le miroir
                if (x1 >= -0.1) {
                    let targetX = (dx > 0) ? X_MAX : X_MIN;
                    let targetY = m * targetX + p;
                    
                    drawnSegments.push({x1: x1, y1: y1, x2: targetX, y2: targetY});
                    rayEquations.push({ m, p, xMin: Math.min(x1, targetX), xMax: Math.max(x1, targetX), color, isVert: false });

                } 
                // 2. RAYON INCIDENT : Va vers le miroir
                else if (x1 < -0.1) {
                    let R = 2 * fValue;
                    
                    // Résolution équation du second degré : (1+m²)x² + (2mp - 2R)x + p² = 0
                    let A = 1 + m*m;
                    let B = 2*m*p - 2*R;
                    let C = p*p;
                    let delta = B*B - 4*A*C;

                    if (delta >= 0) {
                        let sqrtDelta = Math.sqrt(delta);
                        // Plus petite racine (intersection côté gauche de la sphère)
                        let xIntersect = (-B - sqrtDelta) / (2 * A);
                        let yIntersect = m * xIntersect + p;

                        if (xIntersect >= 0 && Math.abs(yIntersect) <= mirrorHeight) {
                            // FRAPPE LA COURBE
                            drawnSegments.push({x1: x1, y1: y1, x2: xIntersect, y2: yIntersect});
                            
                            let impactPoint = board.create('point', [xIntersect, yIntersect], {
                                name: '', size: 3, color: color, fixed: true, highlight: false
                            });
                            customRays.push(impactPoint);

                            rayEquations.push({ m, p, xMin: Math.min(x1, xIntersect), xMax: Math.max(x1, xIntersect), color, isVert: false });
                        } else {
                            // RATE LE MIROIR
                            let targetX = (dx > 0) ? X_MAX : X_MIN;
                            let targetY = m * targetX + p;
                            drawnSegments.push({x1: x1, y1: y1, x2: targetX, y2: targetY});
                            rayEquations.push({ m, p, xMin: Math.min(x1, targetX), xMax: Math.max(x1, targetX), color, isVert: false });
                        }
                    } else {
                        let targetX = (dx > 0) ? X_MAX : X_MIN;
                        let targetY = m * targetX + p;
                        drawnSegments.push({x1: x1, y1: y1, x2: targetX, y2: targetY});
                        rayEquations.push({ m, p, xMin: Math.min(x1, targetX), xMax: Math.max(x1, targetX), color, isVert: false });
                    }
                } else {
                     let targetX = (dx > 0) ? X_MAX : X_MIN;
                     let targetY = m * targetX + p;
                     drawnSegments.push({x1: x1, y1: y1, x2: targetX, y2: targetY});
                     rayEquations.push({ m, p, xMin: Math.min(x1, targetX), xMax: Math.max(x1, targetX), color, isVert: false });
                }
            }

            drawnSegments.forEach(seg => {
                let p1 = board.create('point', [seg.x1, seg.y1], {visible: false, fixed: true, highlight: false});
                let p2 = board.create('point', [seg.x2, seg.y2], {visible: false, fixed: true, highlight: false});
                let line = board.create('segment', [p1, p2], { strokeColor: color, strokeWidth: 1.5, fixed: true, highlight: false });
                customRays.push(p1, p2, line);
            });

            if (rayEquations.length > 1) {
                checkIntersections(rayEquations[rayEquations.length - 1]);
            }
        }

        function checkIntersections(newEq) {
            for (let i = 0; i < rayEquations.length - 1; i++) {
                let oldEq = rayEquations[i];
                let xi, yi;
                let valid = false;

                if (newEq.isVert && oldEq.isVert) continue;
                if (!newEq.isVert && !oldEq.isVert && Math.abs(newEq.m - oldEq.m) < 0.001) continue;

                if (newEq.isVert) {
                    xi = newEq.xMin;
                    yi = oldEq.m * xi + oldEq.p;
                    valid = (yi >= oldEq.yMin - 0.5 && yi <= oldEq.yMax + 0.5);
                } else if (oldEq.isVert) {
                    xi = oldEq.xMin;
                    yi = newEq.m * xi + newEq.p;
                    valid = (yi >= newEq.yMin - 0.5 && yi <= newEq.yMax + 0.5);
                } else {
                    xi = (oldEq.p - newEq.p) / (newEq.m - oldEq.m);
                    yi = newEq.m * xi + newEq.p;
                    valid = true;
                }

                if (valid) {
                    let inNew = newEq.isVert ? true : (xi >= newEq.xMin - 0.5 && xi <= newEq.xMax + 0.5);
                    let inOld = oldEq.isVert ? true : (xi >= oldEq.xMin - 0.5 && xi <= oldEq.xMax + 0.5);

                    if (inNew && inOld && Math.abs(xi) > 0.1 && Math.abs(yi) < Y_MAX) {
                        intersectionCounter++;
                        let name = (intersectionCounter === 1) ? "B'" : "I" + (intersectionCounter - 1);
                        
                        let pInt = board.create('point', [xi, yi], {
                            name: name, size: 4, color: 'black', fixed: true, highlight: false
                        });
                        customRays.push(pInt);
                    }
                }
            }
        }

        // --- OUTILS INTERFACE ---
        document.getElementById('btnRayonParallele').addEventListener('click', function() {
            if (mode.startsWith('par')) { resetMode(); return; }
            resetMode();
            mode = 'par1';
            this.classList.add('active');
            instructions.innerText = "PARALLÈLE (1/3) : 1er point de direction.";
            board.defaultCursor = 'crosshair';
        });

        document.getElementById('btnRayon2Pts').addEventListener('click', function() {
            if (mode === 'pt1' || mode === 'pt2') { resetMode(); return; }
            resetMode();
            mode = 'pt1';
            this.classList.add('active');
            instructions.innerText = "QUELCONQUE (1/2) : Point de départ.";
            board.defaultCursor = 'crosshair';
        });

        document.getElementById('btnPerp').addEventListener('click', function() {
            if (mode === 'perp') { resetMode(); return; }
            resetMode();
            mode = 'perp';
            this.classList.add('active');
            instructions.innerText = "PERPENDICULAIRE : Cliquez sur B' pour tracer A'.";
            board.defaultCursor = 'crosshair';
        });

        document.getElementById('jxgbox').addEventListener('mousedown', function(e) {
            if (mode === '') return; 
            
            e.preventDefault();
            e.stopPropagation();

            let coords = getMouseCoords(e);
            let x = coords.usrCoords[1];
            let y = coords.usrCoords[2];

            let snapped = snapToPoint(x, y);
            x = snapped.x;
            y = snapped.y;

            if (mode === 'par1') {
                dirPoint1 = {x: x, y: y};
                mode = 'par2';
                instructions.innerText = "PARALLÈLE (2/3) : 2ème point pour l'angle.";
            } 
            else if (mode === 'par2') {
                dirPoint2 = {x: x, y: y};
                mode = 'par3';
                instructions.innerText = "PARALLÈLE (3/3) : Point de passage du rayon.";
            } 
            else if (mode === 'par3') {
                let dx = dirPoint2.x - dirPoint1.x;
                let dy = dirPoint2.y - dirPoint1.y;
                addCustomRay(x, y, x + dx, y + dy, 'purple');
                dirPoint1 = null; dirPoint2 = null;
                resetMode();
                instructions.innerText = "Rayon parallèle tracé.";
            }
            else if (mode === 'pt1') {
                tempPoint = {x: x, y: y};
                mode = 'pt2';
                instructions.innerText = "QUELCONQUE (2/2) : 2ème point pour la direction.";
            } 
            else if (mode === 'pt2') {
                addCustomRay(tempPoint.x, tempPoint.y, x, y, 'darkorange');
                tempPoint = null;
                resetMode();
                instructions.innerText = "Rayon tracé.";
            }
            else if (mode === 'perp') {
                let p1 = board.create('point', [x, Y_MIN], {visible: false, fixed: true, highlight: false});
                let p2 = board.create('point', [x, Y_MAX], {visible: false, fixed: true, highlight: false});
                let line = board.create('segment', [p1, p2], { 
                    strokeColor: 'gray', strokeWidth: 1.5, fixed: true, highlight: false, dash: 2
                });
                customRays.push(p1, p2, line);

                let pointAp = board.create('point', [x, 0], {
                    name: "A'", size: 4, color: 'black', fixed: true, highlight: false
                });
                customRays.push(pointAp);

                resetMode();
                instructions.innerText = "Point A' placé.";
            }
        }, true);

        function getMouseCoords(e) {
            let cPos = board.getMousePosition(e);
            return new JXG.Coords(JXG.COORDS_BY_SCREEN, cPos, board);
        }

        function resetMode() {
            mode = '';
            tempPoint = null;
            dirPoint1 = null; dirPoint2 = null;
            document.getElementById('btnRayonParallele').classList.remove('active');
            document.getElementById('btnRayon2Pts').classList.remove('active');
            document.getElementById('btnPerp').classList.remove('active');
            board.defaultCursor = 'default';
        }

        document.getElementById('btnClearRays').addEventListener('click', function() {
            customRays.forEach(el => board.removeObject(el));
            customRays = [];
            rayEquations = []; 
            intersectionCounter = 0; 
            instructions.innerText = "Rayons effacés.";
        });

    </script>
</body>
</html>
