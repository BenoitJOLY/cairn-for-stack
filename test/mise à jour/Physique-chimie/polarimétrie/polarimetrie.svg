<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <!-- Cadran de l'analyseur -->
  <circle cx="50" cy="50" r="38" fill="none" stroke="#2D3748" stroke-width="5" />
  
  <!-- Axe vertical de référence -->
  <line x1="50" y1="12" x2="50" y2="88" stroke="#A0AEC0" stroke-width="2" stroke-dasharray="4 4" />

  <!-- Arc de cercle pour l'angle alpha -->
  <path d="M 50 26 A 24 24 0 0 1 62 28.2" fill="none" stroke="#E53E3E" stroke-width="3" />
  
  <!-- Flèche de polarisation déviée (angle alpha) -->
  <g transform="translate(50, 50) rotate(30)" stroke="#E53E3E" stroke-width="5" stroke-linecap="round">
    <line x1="0" y1="-30" x2="0" y2="30" />
    <polygon points="0,-38 -6,-28 6,-28" fill="#E53E3E" stroke="none" />
    <polygon points="0,38 -6,28 6,28" fill="#E53E3E" stroke="none" />
  </g>
</svg>
