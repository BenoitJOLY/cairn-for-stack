services:
  cairn-for-stack:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: cairn-for-stack
    ports:
      - "${PORT:-3000}:3000"
    volumes:
      - ./index.html:/app/index.html
      - ./depot.html:/app/depot.html
      - ./admin.html:/app/admin.html
      - ./validation.html:/app/validation.html
      - ./login.html:/app/login.html
      - ./register.html:/app/register.html
      - ./js:/app/js
      - ./css:/app/css
      - ./lang:/app/lang
      - ./lib:/app/lib
      - ./assets:/app/assets
      - ./server:/app/server
      - /app/server/node_modules
    environment:
      - ACCOUNT_USERNAME=${ACCOUNT_USERNAME:-}
      - ACCOUNT_PASSWORD=${ACCOUNT_PASSWORD:-}
      - ACCOUNT_ROLE=${ACCOUNT_ROLE:-}
      - SECRETS_KEY=${SECRETS_KEY:-}
    restart: unless-stopped
    networks:
      - default
      - maxima_net

# Réseau du projet Docker Maxima/Stack-API (goemaxima), déjà créé par son propre
# compose.yaml — on le rejoint ici (external: true, donc pas recréé) pour que ce
# conteneur puisse joindre stack-api par son nom sans jamais passer par internet
# ni par un port exposé publiquement. Le nom réel du réseau dépend du nom du
# projet Compose externe ("maxima_default" par défaut, pour un projet nommé
# "maxima") : si le vôtre porte un autre nom, fixez MAXIMA_NETWORK_NAME dans
# .env plutôt que d'éditer ce fichier (voir doc/guide-administrateur.html §4).
# Le nom d'hôte du service stack-api à l'intérieur de ce réseau, lui, se règle
# dans le panneau Administration de l'application (pas ici).
networks:
  maxima_net:
    external: true
    name: ${MAXIMA_NETWORK_NAME:-maxima_default}
